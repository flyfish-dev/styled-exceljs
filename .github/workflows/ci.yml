name: Parser regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/corpus

  node:
    needs: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/corpus
      - run: make all
      - run: npm run test:security
      - run: npm run test:table-styles
      - run: npm run test:cfb-minifat
      - run: node --test .github/scripts/publish-npm.test.mjs
      - name: CJS and ESM corpus regression
        env:
          FMTS: ${{ matrix.node == 24 && 'full' || 'misc' }}
          STYLED_TEST_RUNTIME: node
        run: npm run test:corpus
      - run: npm pack --dry-run --ignore-scripts

  alternate-runtimes:
    needs: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/corpus
      - run: make all
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - name: Bun ESM core regression
        if: matrix.runtime == 'bun'
        env:
          FMTS: misc
          STYLED_TEST_RUNTIME: bun
        run: bun node_modules/mocha/bin/mocha.js --require ./tests/runtime-identity.cjs -R dot -t 30000 test.mjs
      - name: Deno ESM core regression
        if: matrix.runtime == 'deno'
        env:
          FMTS: misc
          STYLED_TEST_RUNTIME: deno
        run: deno run --allow-env --allow-read --allow-write node_modules/mocha/bin/mocha.js --require ./tests/runtime-identity.cjs -R dot -t 30000 test.mjs
